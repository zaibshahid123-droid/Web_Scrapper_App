{% extends 'scraper/base.html' %}

{% block auth_content %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — WebScraper Pro</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top left, #1a1d3a 0%, #0f1117 60%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #1a1d2e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
    }
    .login-brand {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .form-control {
      background: #0f1117;
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0;
    }
    .form-control:focus {
      background: #0f1117;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.25);
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-brand"><i class="bi bi-spider me-2"></i>WebScraper Pro</div>
      <p class="text-muted mt-1 small">Sign in to manage your scraping jobs</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger py-2 small">
      <i class="bi bi-exclamation-triangle me-1"></i>
      Invalid username or password. Please try again.
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />

      <div class="mb-3">
        <label class="form-label text-muted small fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted">
            <i class="bi bi-person"></i>
          </span>
          <input type="text" name="username" class="form-control"
                 placeholder="Enter username" autofocus required />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-muted small fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-muted">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" name="password" class="form-control"
                 placeholder="Enter password" required />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmXjFbI1wQ4Ej/o3hVB4QQk+e0m1jz"
          crossorigin="anonymous"></script>
</body>
</html>
{% endblock %}
